name: Inspect public cohort metadata
on:
  push:
    branches: [codex/full-project-implementation]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas openpyxl
      - name: Inspect GEO sample IDs and Table S1
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import pandas as pd

          sources = {
              "baseline": "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE253nnn/GSE253564/suppl/GSE253564_Pre-treatment_Samples_Pubs_FPKMs.txt.gz",
              "table_s1": [
                  "https://pmc.ncbi.nlm.nih.gov/articles/PMC10982989/bin/mmc2.xlsx",
                  "https://pmc.ncbi.nlm.nih.gov/articles/instance/10982989/bin/mmc2.xlsx",
                  "https://ars.els-cdn.com/content/image/1-s2.0-S2666379124000612-mmc2.xlsx",
              ],
          }
          root = Path("source-inspection")
          root.mkdir()

          def fetch(url, target):
              request = Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; academic-research/1.0)"})
              with urlopen(request, timeout=90) as response:
                  target.write_bytes(response.read())

          baseline = root / "baseline.txt.gz"
          fetch(sources["baseline"], baseline)
          expression = pd.read_csv(baseline, sep="\\t", index_col=0, compression="gzip")
          print("BASELINE_SHAPE", expression.shape)
          print("BASELINE_SAMPLE_IDS", list(expression.columns))

          supplement = root / "table_s1.xlsx"
          errors = []
          for url in sources["table_s1"]:
              try:
                  fetch(url, supplement)
                  if supplement.read_bytes()[:2] == b"PK":
                      break
                  errors.append(f"Not an xlsx response: {url}")
              except Exception as exc:
                  errors.append(f"{url}: {type(exc).__name__}: {exc}")
          else:
              raise RuntimeError("Could not fetch Table S1: " + " | ".join(errors))

          workbook = pd.ExcelFile(supplement)
          print("TABLE_S1_SHEETS", workbook.sheet_names)
          for sheet in workbook.sheet_names:
              table = pd.read_excel(supplement, sheet_name=sheet, dtype=str)
              print("TABLE_S1_SHEET", sheet, "SHAPE", table.shape)
              print("TABLE_S1_COLUMNS", table.columns.tolist())
              print(table.to_string(index=False))
          PY
