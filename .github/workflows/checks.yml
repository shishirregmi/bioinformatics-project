name: Pipeline checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Inspect public cohort crosswalk (temporary)
        run: |
          pip install openpyxl
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re
          import pandas as pd

          root = Path("/tmp/source-inspection")
          root.mkdir()
          matrix_path = root / "baseline.txt.gz"
          workbook_path = root / "table_s1.xlsx"

          def fetch(url, target):
              request = Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; academic-research/1.0)"})
              with urlopen(request, timeout=90) as response:
                  target.write_bytes(response.read())

          fetch("https://ftp.ncbi.nlm.nih.gov/geo/series/GSE253nnn/GSE253564/suppl/GSE253564_Pre-treatment_Samples_Pubs_FPKMs.txt.gz", matrix_path)
          expression = pd.read_csv(matrix_path, sep="\t", index_col=0, compression="gzip")
          print("BASELINE_RAW_HEADERS", pd.read_csv(matrix_path, sep="\\t", nrows=0).columns.tolist())
          print("BASELINE_SHAPE", expression.shape)
          print("BASELINE_SAMPLE_IDS", list(expression.columns))
          print("BASELINE_FIRST_ROWS", expression.iloc[:3, :5].to_string())

          urls = [
              "https://pmc.ncbi.nlm.nih.gov/articles/PMC10982989/bin/mmc2.xlsx",
              "https://pmc.ncbi.nlm.nih.gov/articles/instance/10982989/bin/mmc2.xlsx",
              "https://ars.els-cdn.com/content/image/1-s2.0-S2666379124000612-mmc2.xlsx",
          ]
          errors = []
          for url in urls:
              try:
                  fetch(url, workbook_path)
                  if workbook_path.read_bytes()[:2] == b"PK":
                      break
                  errors.append(f"Not an xlsx response: {url}")
              except Exception as exc:
                  errors.append(f"{url}: {type(exc).__name__}: {exc}")
          else:
              raise RuntimeError("Could not fetch Table S1: " + " | ".join(errors))

          book = pd.ExcelFile(workbook_path)
          print("TABLE_S1_SHEETS", book.sheet_names)
          pattern = re.compile(r"sample|specimen|GEO|accession|patient|case|arm|MPR|path|pre|post|RNA.?seq|response", re.I)
          for sheet in book.sheet_names:
              table = pd.read_excel(workbook_path, sheet_name=sheet, dtype=str, header=None)
              print("TABLE_S1_SHEET", sheet, "SHAPE", table.shape)
              print("TABLE_S1_TOP_ROWS", table.iloc[:15, :].to_string(index=False, header=False))
          PY
      - run: sh -n docker-entrypoint.sh
      - name: Simulate Windows CRLF checkout
        run: python -c "from pathlib import Path; path = Path('docker-entrypoint.sh'); path.write_bytes(path.read_bytes().replace(b'\\n', b'\\r\\n'))"
      - run: docker build --tag radio-transfer:test .
      - name: Prepare cached matrices for container smoke test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          genes = []
          for path in (Path("config/rss.json"), Path("config/immune.json")):
              genes.extend(item["gene"] for item in json.loads(path.read_text())["genes"])
          genes = list(dict.fromkeys(genes)) + [f"SMOKE_{i}" for i in range(40)]
          output = Path("smoke/data/raw")
          output.mkdir(parents=True)
          rng = np.random.default_rng(76)
          for name, filename, count in (
              ("baseline", "GSE253564_Pre-treatment_Samples_Pubs_FPKMs.txt.gz", 8),
              ("post", "GSE248378_Durva_Post_FPKMs.txt.gz", 7),
          ):
              values = rng.lognormal(mean=1, sigma=1, size=(len(genes), count))
              columns = [f"{name}_{i}" for i in range(count)]
              pd.DataFrame(values, index=genes, columns=columns).to_csv(output / filename, sep="\t", compression="gzip")
          PY
      - name: Run container and verify the web report
        run: |
          mkdir -p smoke/results
          docker run -d --rm --name radio-transfer-smoke -p 8000:8000 \
            -v "$PWD/smoke/data:/app/data" \
            -v "$PWD/smoke/results:/app/results" \
            radio-transfer:test
          trap 'docker stop radio-transfer-smoke >/dev/null 2>&1 || true' EXIT
          attempt=0
          until curl --fail --silent http://127.0.0.1:8000/ -o smoke/report.html; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then docker logs radio-transfer-smoke; exit 1; fi
            sleep 1
          done
          grep -q "Radiotherapy RNA-seq data explorer" smoke/report.html
          curl --fail --silent http://127.0.0.1:8000/baseline/expression_pca.png -o /dev/null
