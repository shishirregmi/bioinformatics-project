name: Pipeline checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Inspect candidate independent radiogenomic data (temporary)
        run: |
          set -euo pipefail
          mkdir -p /tmp/radio-data
          curl --fail --location --silent --show-error "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fncomms11428/MediaObjects/41467_2016_BFncomms11428_MOESM708_ESM.xlsx" -o /tmp/radio-data/radiation.xlsx
          curl --fail --location --silent --show-error "https://data.broadinstitute.org/ccle/CCLE_RNAseq_genes_rpkm_20180929.gct.gz" -o /tmp/radio-data/ccle.gct.gz
          pip install openpyxl
          python - <<'PY'
          import gzip
          from pathlib import Path
          import pandas as pd

          path = Path("/tmp/radio-data/radiation.xlsx")
          book = pd.ExcelFile(path)
          print("RADIO_SHEETS", book.sheet_names)
          for sheet in book.sheet_names:
              frame = pd.read_excel(path, sheet_name=sheet, header=None)
              print("RADIO_SHEET", sheet, "shape", frame.shape)
              print(frame.head(5).to_string(index=False, header=False))
          with gzip.open("/tmp/radio-data/ccle.gct.gz", "rt") as source:
              gct_header = [source.readline().rstrip() for _ in range(3)]
              for index, line in enumerate(gct_header):
                  print("CCLE_GCT_HEADER", index, line[:700])
          columns = gct_header[2].split("\\t")[2:]
          radiation = pd.read_excel(path, sheet_name=0, header=1)
          radiation = radiation.dropna(subset=["Cell Line", "Site", "AUC"])
          radiation["candidate"] = radiation["Cell Line"].astype(str).str.strip().str.upper() + "_" + radiation["Site"].astype(str).str.strip().str.upper().str.replace(" ", "_", regex=False)
          available = set(columns)
          radiation["exact_ccle_match"] = radiation["candidate"].isin(available)
          print("RADIO_DATA_ROWS", len(radiation))
          print("RADIO_SITE_COUNTS", radiation["Site"].value_counts().to_dict())
          print("RADIO_SUBHISTOLOGY_COUNTS", radiation["Subhistology"].value_counts().head(20).to_dict())
          print("RADIO_EXACT_CELL_SITE_MATCHES", int(radiation["exact_ccle_match"].sum()), "/", len(radiation))
          print("RADIO_UNMATCHED_EXAMPLES", radiation.loc[~radiation["exact_ccle_match"], ["Cell Line", "Site", "candidate"]].head(20).to_dict(orient="records"))
          print("RADIO_AUC_RANGE", float(radiation["AUC"].min()), float(radiation["AUC"].max()))
          PY
      - run: sh -n docker-entrypoint.sh
      - name: Simulate Windows CRLF checkout
        run: python -c "from pathlib import Path; path = Path('docker-entrypoint.sh'); path.write_bytes(path.read_bytes().replace(b'\\n', b'\\r\\n'))"
      - run: docker build --tag radio-transfer:test .
      - name: Prepare cached matrices for container smoke test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          genes = []
          for path in (Path("config/rss.json"), Path("config/immune.json")):
              genes.extend(item["gene"] for item in json.loads(path.read_text())["genes"])
          genes = list(dict.fromkeys(genes)) + [f"SMOKE_{i}" for i in range(40)]
          output = Path("smoke/data/raw")
          output.mkdir(parents=True)
          rng = np.random.default_rng(76)
          for name, filename, count in (
              ("baseline", "GSE253564_Pre-treatment_Samples_Pubs_FPKMs.txt.gz", 8),
              ("post", "GSE248378_Durva_Post_FPKMs.txt.gz", 7),
          ):
              values = rng.lognormal(mean=1, sigma=1, size=(len(genes), count))
              columns = [f"{name}_{i}" for i in range(count)]
              pd.DataFrame(values, index=genes, columns=columns).to_csv(output / filename, sep="\t", compression="gzip")
          clinical = pd.DataFrame({
              "sample_id": [f"baseline_{i}" for i in range(8)],
              "patient_id": [f"patient_{i}" for i in range(8)],
              "baseline": ["1"] * 8,
              "arm": ["durvalumab", "durvalumab_sbrt"] * 4,
              "mpr": ["0", "0", "0", "1", "0", "1", "0", "0"],
              "label_source": ["synthetic CI fixture"] * 8,
              "verified": ["1"] * 8,
          })
          clinical.to_csv("smoke/data/clinical.csv", index=False)
          PY
      - name: Run container and verify the web report
        run: |
          mkdir -p smoke/results
          docker run -d --rm --name radio-transfer-smoke -p 8000:8000 \
            -v "$PWD/smoke/data:/app/data" \
            -v "$PWD/smoke/results:/app/results" \
            -e METADATA=/app/data/clinical.csv \
            radio-transfer:test
          trap 'docker stop radio-transfer-smoke >/dev/null 2>&1 || true' EXIT
          attempt=0
          until curl --fail --silent http://127.0.0.1:8000/ -o smoke/report.html; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then docker logs radio-transfer-smoke; exit 1; fi
            sleep 1
          done
          grep -q "Radiotherapy RNA-seq data explorer" smoke/report.html
          grep -q "Outcome analysis" smoke/report.html
          curl --fail --silent http://127.0.0.1:8000/analysis/analysis_report.html -o /dev/null
          curl --fail --silent http://127.0.0.1:8000/exploration/baseline/expression_pca.png -o /dev/null
